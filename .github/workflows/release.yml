name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versienummer bepalen (1.<volgnummer van deze run>)
        run: |
          echo "VERSION=1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Ondertekeningssleutel klaarzetten (alleen als de secrets bestaan)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p sleutel
            echo "$KEYSTORE_BASE64" | base64 -d > sleutel/release.jks
            {
              echo "storeFile=sleutel/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          else
            echo "::error::Geen ondertekeningssecrets: een met de debug-sleutel ondertekende APK kan niet over de bestaande installatie heen. Stel KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS en KEY_PASSWORD in."
            exit 1
          fi
      - run: gradle testDebugUnitTest assembleRelease --no-daemon -PversionName=$VERSION -PversionCode=${{ github.run_number }}
      - run: cp app/build/outputs/apk/release/app-release.apk BacklogZero.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Versie ${{ env.VERSION }}
          files: BacklogZero.apk
          generate_release_notes: true
