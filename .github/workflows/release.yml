name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Ondertekeningssleutel klaarzetten (alleen als de secrets bestaan)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p sleutel
            echo "$KEYSTORE_BASE64" | base64 -d > sleutel/release.jks
            {
              echo "storeFile=sleutel/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          else
            echo "::warning::Geen ondertekeningssecrets gevonden; de APK wordt met de debug-sleutel ondertekend."
          fi
      - run: gradle testDebugUnitTest assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk BacklogZero.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: BacklogZero.apk
          generate_release_notes: true
